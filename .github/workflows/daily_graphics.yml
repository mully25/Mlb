name: Daily MLB Graphics Update

on:
  schedule:
    - cron: '0 13 * * *'  # 9am EDT (UTC-4) / runs at 10am when clocks change to EST
  workflow_dispatch:       # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update-graphics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow pandas numpy requests

      - name: Generate graphics
        env:
          NO_AUTO_PHOTO: "1"
        run: |
          python3 mlb_graphic.py "" ba
          sleep 45
          python3 mlb_graphic.py "" slg
          sleep 45
          python3 mlb_graphic.py "" woba
          sleep 45
          python3 pitching_graphic.py "" era
          sleep 45
          python3 counting_graphic.py "" hr
          sleep 45
          python3 mlb_graphic.py "" obp

      - name: Commit and push updated graphics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ba_top10.png slg_top10.png woba_top10.png era_top10.png hr_top10.png obp_top10.png
          git diff --staged --quiet || git commit -m "Auto-update graphics $(date +'%-m/%-d/%y')"
          git push
