name: Keepalive — Daily Graphics Backup

on:
  schedule:
    - cron: '0 9 * * *'  # 5am ET (9am UTC) — backup run after main workflow
  workflow_dispatch:
  push:
    branches:
      - claude/mlb-xwoba-top-10-graphic-LjKzs
    paths-ignore:
      - 'hitting/**'
      - 'pitching/**'
      - '_cache/**'
      - '.github/**'

permissions:
  contents: write

jobs:
  update-graphics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: claude/mlb-xwoba-top-10-graphic-LjKzs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pillow numpy pandas python-dotenv scipy tzdata

      - name: Generate graphics
        run: python3 graphic.py
        continue-on-error: true

      - name: Commit and push updated graphics
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add hitting/ pitching/ _cache/rankings.json || true
          git diff --staged --quiet || git commit -m "Update graphics $(date +'%Y-%m-%d') [keepalive]"
          git pull --rebase origin claude/mlb-xwoba-top-10-graphic-LjKzs
          git push origin claude/mlb-xwoba-top-10-graphic-LjKzs
