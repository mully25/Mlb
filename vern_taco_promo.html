<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vern Taco Promo</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@400;600;700&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #1a1a1a;
    }

    .card {
      width: 800px;
      height: 800px;
      position: relative;
      overflow: hidden;
      background: #0d0d0d;
      font-family: 'Oswald', sans-serif;
    }

    /* Textured background */
    .card::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(180, 100, 20, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, rgba(180, 60, 20, 0.18) 0%, transparent 55%),
        repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(255,255,255,0.012) 2px,
          rgba(255,255,255,0.012) 4px
        );
      z-index: 0;
    }

    /* Gold border frame */
    .frame {
      position: absolute;
      inset: 18px;
      border: 3px solid #c9a227;
      z-index: 1;
    }
    .frame-inner {
      position: absolute;
      inset: 26px;
      border: 1px solid rgba(201,162,39,0.4);
      z-index: 1;
    }

    /* Corner ornaments */
    .corner {
      position: absolute;
      width: 38px;
      height: 38px;
      z-index: 2;
    }
    .corner svg { width: 38px; height: 38px; }
    .corner.tl { top: 12px; left: 12px; }
    .corner.tr { top: 12px; right: 12px; transform: scaleX(-1); }
    .corner.bl { bottom: 12px; left: 12px; transform: scaleY(-1); }
    .corner.br { bottom: 12px; right: 12px; transform: scale(-1); }

    /* Decorative divider lines */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 3;
      position: relative;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #c9a227, transparent);
    }
    .divider-diamond {
      width: 8px;
      height: 8px;
      background: #c9a227;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* Layout */
    .content {
      position: relative;
      z-index: 3;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 70px;
      gap: 0;
    }

    /* Top label */
    .top-label {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 6px;
      color: #c9a227;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    /* Taco emoji row */
    .taco-row {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 18px;
    }
    .taco-emoji {
      font-size: 58px;
      filter: drop-shadow(0 0 14px rgba(201,162,39,0.5));
      animation: float 3s ease-in-out infinite;
    }
    .taco-emoji:nth-child(2) { animation-delay: 0.5s; }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* Main headline */
    .headline {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 80px;
      color: #ffffff;
      line-height: 1;
      text-align: center;
      text-shadow: 0 2px 20px rgba(0,0,0,0.8);
      margin-bottom: 4px;
      letter-spacing: -1px;
    }
    .headline span {
      color: #c9a227;
    }

    /* "FOR" text */
    .for-text {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 22px;
      letter-spacing: 8px;
      color: #aaaaaa;
      text-transform: uppercase;
      margin: 8px 0;
    }

    /* Price */
    .price {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 110px;
      color: #c9a227;
      line-height: 1;
      text-shadow: 0 0 40px rgba(201,162,39,0.4), 0 4px 20px rgba(0,0,0,0.9);
      letter-spacing: -2px;
      margin-bottom: 4px;
    }

    /* Divider section */
    .divider-wrap {
      width: 100%;
      margin: 16px 0;
    }

    /* Restaurant name */
    .restaurant-name {
      font-family: 'Dancing Script', cursive;
      font-size: 46px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.7);
      margin-bottom: 4px;
    }

    /* Location */
    .location {
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 4px;
      color: #888888;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    /* Badge */
    .badge {
      background: linear-gradient(135deg, #c9a227 0%, #e8c84a 50%, #c9a227 100%);
      color: #0d0d0d;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 9px 28px;
      clip-path: polygon(8px 0%, calc(100% - 8px) 0%, 100% 50%, calc(100% - 8px) 100%, 8px 100%, 0% 50%);
    }

    /* Flame accents */
    .flames {
      position: absolute;
      bottom: 36px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 45px;
      z-index: 2;
      opacity: 0.25;
      font-size: 26px;
      letter-spacing: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Background frame -->
    <div class="frame"></div>
    <div class="frame-inner"></div>

    <!-- Corner ornaments -->
    <div class="corner tl">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 L14 2 L2 14 Z" fill="#c9a227" opacity="0.8"/>
        <path d="M2 2 L2 20" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M2 2 L20 2" stroke="#c9a227" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="2" fill="#c9a227" opacity="0.5"/>
      </svg>
    </div>
    <div class="corner tr">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 L14 2 L2 14 Z" fill="#c9a227" opacity="0.8"/>
        <path d="M2 2 L2 20" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M2 2 L20 2" stroke="#c9a227" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="2" fill="#c9a227" opacity="0.5"/>
      </svg>
    </div>
    <div class="corner bl">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 L14 2 L2 14 Z" fill="#c9a227" opacity="0.8"/>
        <path d="M2 2 L2 20" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M2 2 L20 2" stroke="#c9a227" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="2" fill="#c9a227" opacity="0.5"/>
      </svg>
    </div>
    <div class="corner br">
      <svg viewBox="0 0 38 38" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 2 L14 2 L2 14 Z" fill="#c9a227" opacity="0.8"/>
        <path d="M2 2 L2 20" stroke="#c9a227" stroke-width="1.5"/>
        <path d="M2 2 L20 2" stroke="#c9a227" stroke-width="1.5"/>
        <circle cx="22" cy="22" r="2" fill="#c9a227" opacity="0.5"/>
      </svg>
    </div>

    <!-- Flame row bottom -->
    <div class="flames">🌶️🌶️🌶️🌶️🌶️🌶️🌶️🌶️🌶️🌶️</div>

    <!-- Main content -->
    <div class="content">
      <div class="top-label">Limited Time Offer</div>

      <div class="taco-row">
        <div class="taco-emoji">🌮</div>
        <div class="taco-emoji">🌮</div>
      </div>

      <div class="headline"><span>2</span> Tacos</div>
      <div class="for-text">for only</div>
      <div class="price">$12</div>

      <div class="divider-wrap">
        <div class="divider">
          <div class="divider-line"></div>
          <div class="divider-diamond"></div>
          <div class="divider-diamond"></div>
          <div class="divider-diamond"></div>
          <div class="divider-line"></div>
        </div>
      </div>

      <div class="restaurant-name">Vern Restaurant &amp; Bar</div>
      <div class="location">West Babylon, New York</div>

      <div class="badge">Dine In &nbsp;·&nbsp; Takeout &nbsp;·&nbsp; Bar</div>
    </div>
  </div>
</body>
</html>
