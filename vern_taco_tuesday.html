<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vern Taco Tuesday</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@300;400;600;700&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #111;
    }

    .card {
      width: 900px;
      height: 900px;
      position: relative;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Oswald', sans-serif;
    }

    /* ── PHOTO PANELS ── */
    .photo-row {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 420px;
      display: flex;
      gap: 4px;
    }
    .photo-panel {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .photo-panel img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 30%;
      display: block;
      transition: transform 0.6s ease;
    }
    /* Gradient overlay darkening bottom of photos */
    .photo-panel::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 180px;
      background: linear-gradient(to bottom, transparent, #0a0a0a);
      z-index: 1;
    }
    /* Side vignette on left panel */
    .photo-panel:first-child::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; right: 0;
      width: 30px;
      background: linear-gradient(to right, transparent, #0a0a0a);
      z-index: 1;
    }
    /* Side vignette on right panel */
    .photo-panel:last-child::before {
      content: '';
      position: absolute;
      top: 0; bottom: 0; left: 0;
      width: 30px;
      background: linear-gradient(to left, transparent, #0a0a0a);
      z-index: 1;
    }

    /* ── GOLD BORDER FRAME ── */
    .frame {
      position: absolute;
      inset: 16px;
      border: 2.5px solid #c9a227;
      z-index: 10;
      pointer-events: none;
    }
    .frame-inner {
      position: absolute;
      inset: 24px;
      border: 1px solid rgba(201,162,39,0.3);
      z-index: 10;
      pointer-events: none;
    }

    /* ── CORNER ORNAMENTS ── */
    .corner {
      position: absolute;
      width: 36px;
      height: 36px;
      z-index: 11;
    }
    .corner svg { width: 36px; height: 36px; }
    .corner.tl { top: 10px; left: 10px; }
    .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner.br { bottom: 10px; right: 10px; transform: scale(-1); }

    /* ── TEXT SECTION ── */
    .text-block {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 500px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 60px 50px;
      z-index: 5;
      gap: 0;
    }

    /* TACO TUESDAY badge */
    .tt-badge {
      background: linear-gradient(135deg, #c9a227 0%, #f0d060 50%, #c9a227 100%);
      color: #0a0a0a;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 5px;
      text-transform: uppercase;
      padding: 10px 36px;
      clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
      margin-bottom: 20px;
    }

    /* Main deal headline */
    .deal-line {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }
    .deal-num {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 130px;
      color: #ffffff;
      line-height: 1;
      text-shadow: 0 0 60px rgba(201,162,39,0.25), 0 4px 30px rgba(0,0,0,0.9);
      letter-spacing: -4px;
    }
    .deal-for {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 28px;
      letter-spacing: 6px;
      color: #aaaaaa;
      text-transform: uppercase;
      margin: 0 4px;
    }
    .deal-tacos {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-style: italic;
      font-size: 62px;
      color: #c9a227;
      line-height: 1;
      text-shadow: 0 0 30px rgba(201,162,39,0.4);
    }

    /* Price */
    .price-wrap {
      display: flex;
      align-items: flex-start;
      margin-bottom: 18px;
    }
    .price-dollar {
      font-family: 'Playfair Display', serif;
      font-weight: 700;
      font-size: 42px;
      color: #c9a227;
      line-height: 1.2;
      margin-top: 10px;
    }
    .price-num {
      font-family: 'Playfair Display', serif;
      font-weight: 900;
      font-size: 120px;
      color: #c9a227;
      line-height: 1;
      text-shadow: 0 0 50px rgba(201,162,39,0.5), 0 4px 30px rgba(0,0,0,0.9);
      letter-spacing: -3px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      margin: 14px 0;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, #c9a227, transparent);
    }
    .divider-diamond {
      width: 7px;
      height: 7px;
      background: #c9a227;
      transform: rotate(45deg);
      flex-shrink: 0;
    }

    /* Restaurant name */
    .restaurant-name {
      font-family: 'Dancing Script', cursive;
      font-size: 44px;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      letter-spacing: 1px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.8);
      margin-bottom: 4px;
    }

    .location {
      font-family: 'Oswald', sans-serif;
      font-weight: 300;
      font-size: 12px;
      letter-spacing: 4px;
      color: #888888;
      text-transform: uppercase;
    }

    /* Every Tuesday label */
    .every-tuesday {
      position: absolute;
      top: 398px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      background: #c9a227;
      color: #0a0a0a;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      padding: 7px 24px;
      white-space: nowrap;
    }

    /* Bottom row small tagline */
    .tagline {
      position: absolute;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 8;
      font-family: 'Oswald', sans-serif;
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 3px;
      color: rgba(201,162,39,0.6);
      text-transform: uppercase;
      white-space: nowrap;
    }
  </style>
</head>
