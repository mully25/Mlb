<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Vern Taco Tuesday</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Oswald:wght@300;400;700&family=Dancing+Script:wght@700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #111;
    }

    /* Card uses normal flow so text can never overflow the frame boundary */
    .card {
      width: 900px;
      height: 900px;
      position: relative;
      background: #0a0a0a;
      font-family: 'Oswald', sans-serif;
      /* 19px padding keeps all content inside the gold frame (frame border at 16px) */
      display: flex;
      flex-direction: column;
      padding: 19px;
      overflow: hidden;
    }

    /* ── GOLD FRAME ── */
    .frame {
      position: absolute; inset: 16px;
      border: 2.5px solid #c9a227;
      z-index: 20; pointer-events: none;
    }
    .frame-inner {
      position: absolute; inset: 24px;
      border: 1px solid rgba(201,162,39,0.35);
      z-index: 20; pointer-events: none;
    }

    /* ── CORNER ORNAMENTS ── */
    .corner { position: absolute; width: 36px; height: 36px; z-index: 21; }
    .corner svg { width: 36px; height: 36px; }
    .corner.tl { top: 10px; left: 10px; }
    .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
    .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
    .corner.br { bottom: 10px; right: 10px; transform: scale(-1); }

    /* ── PHOTO SECTION ── */
    .photo-row {
      flex: 0 0 360px;
      display: flex;
      gap: 3px;
      overflow: hidden;
      position: relative;
    }
    .photo-panel {
      flex: 1;
      overflow: hidden;
    }
    .photo-panel img {
      width: 100%; height: 100%;
      object-fit: cover;
      /* LEFT TOP keeps the tacos (in left portion of each crop) fully visible */
      object-position: left top;
      display: block;
    }
    /* gradient fades bottom of photos into card background */
    .photo-row::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 90px;
      background: linear-gradient(to bottom, transparent, #0a0a0a);
      pointer-events: none;
    }

    /* ── TEXT SECTION — flows naturally after photos, always inside frame ── */
    .text-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 0 44px 4px;
      min-height: 0; /* prevents flex overflow */
    }

    /* TACO TUESDAY badge */
    .tt-badge {
      background: linear-gradient(135deg, #b8901f 0%, #e8c84a 50%, #b8901f 100%);
      color: #0a0a0a;
      font-weight: 700; font-size: 12px;
      letter-spacing: 5px; text-transform: uppercase;
      padding: 8px 30px;
      clip-path: polygon(10px 0%, calc(100% - 10px) 0%, 100% 50%, calc(100% - 10px) 100%, 10px 100%, 0% 50%);
      white-space: nowrap;
    }

    /* "2 Tacos" */
    .deal-top {
      font-family: 'Playfair Display', serif;
      font-weight: 900; font-size: 88px; line-height: 1;
      color: #fff; text-align: center;
      letter-spacing: -2px;
      text-shadow: 0 3px 20px rgba(0,0,0,0.9);
      white-space: nowrap;
    }
    .deal-top .num { color: #c9a227; }

    /* "for" */
    .deal-for {
      font-weight: 300; font-size: 16px;
      letter-spacing: 8px; color: #888;
      text-transform: uppercase;
      white-space: nowrap;
    }

    /* "$12" */
    .deal-price {
      font-family: 'Playfair Display', serif;
      font-weight: 900; font-size: 100px; line-height: 1;
      color: #c9a227; letter-spacing: -3px;
      text-shadow: 0 0 40px rgba(201,162,39,0.4), 0 4px 20px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    /* Divider */
    .divider {
      display: flex; align-items: center; gap: 9px; width: 100%;
    }
    .div-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, #c9a227, transparent);
    }
    .div-gem {
      width: 6px; height: 6px;
      background: #c9a227; transform: rotate(45deg); flex-shrink: 0;
    }

    /* Restaurant name — one line, no indent */
    .restaurant-name {
      font-family: 'Dancing Script', cursive;
      font-weight: 700; font-size: 40px;
      color: #fff; text-align: center;
      white-space: nowrap; text-indent: 0;
      letter-spacing: 0.5px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }

    .location {
      font-weight: 300; font-size: 11px;
      letter-spacing: 4px; color: #777;
      text-transform: uppercase; white-space: nowrap;
    }

    .bottom-tag {
      font-weight: 400; font-size: 10px;
      letter-spacing: 3px; color: rgba(201,162,39,0.55);
      text-transform: uppercase; white-space: nowrap;
    }
  </style>
</head>
